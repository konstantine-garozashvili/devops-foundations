services:
  frontend:
    volumes:
      - ./src/frontend:/usr/share/nginx/html:ro

  backend:
    environment:
      - APP_ENV=development
    volumes:
      # Mount only the source file for hot-reload — do NOT mount the whole /app
      # so the container's node_modules (built by npm ci) are preserved.
      - ./src/backend/server.js:/app/server.js:ro

