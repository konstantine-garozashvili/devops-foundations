entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  docker:
    exposedByDefault: false
    # endpoint: "unix:///var/run/docker.sock"
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true

ping: {}

log:
  level: DEBUG

accessLog: {}

# Certificates will be generated locally via mkcert and mounted into the
# Traefik container. The detailed configuration will be completed in a
# dedicated infrastructure feature.

