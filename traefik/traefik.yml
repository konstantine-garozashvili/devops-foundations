entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    endpoint: "unix:///var/run/docker.sock"

api:
  dashboard: true

log:
  level: INFO

accessLog: {}

# Certificates will be generated locally via mkcert and mounted into the
# Traefik container. The detailed configuration will be completed in a
# dedicated infrastructure feature.

